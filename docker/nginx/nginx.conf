user  nginx;
worker_processes 1;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;
events {
    worker_connections 1024;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 100M;

    # Recover the patron's address before anything is keyed on it.
    #
    # Without this, `$binary_remote_addr` is the PEER, and in any deployment
    # with a proxy in front of this container that peer is the same address for
    # every patron on the instance. Every zone below then degrades from a
    # per-client limit into ONE GLOBAL BUCKET: lennyforlibraries.org allowed
    # four OTP page loads across all patrons combined before returning 429, and
    # ten borrows a minute for the entire library. It looks fine for one user
    # and falls over the moment two people use the site at once, which is
    # exactly how it was found — during a demo.
    #
    # `real_ip_recursive` is deliberately left OFF (the default). nginx then
    # takes the LAST entry in X-Forwarded-For, which is the address the front
    # proxy actually observed. With it on, nginx would walk right-to-left
    # skipping trusted addresses — and a library whose own LAN sits inside the
    # trusted range would let a patron append a value and choose their own
    # apparent address.
    #
    # The range matches LENNY_FORWARDED_ALLOW_IPS' default (see
    # docker/api/Dockerfile and ArchiveLabs/lenny#210): Docker allocates
    # Compose networks from 172.16.0.0/12. If no proxy is in front, no
    # X-Forwarded-For arrives and $remote_addr is left alone, so this is inert
    # rather than wrong on a plain install.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    # Rate limiting: shared memory zones, no DB overhead.
    # These are crude flood stops, NOT the real abuse controls. Two reasons
    # they cannot be: a public library's patrons all egress from one NAT
    # address and so share a bucket however well it is keyed, and the limits
    # that actually matter are per-account. OTP sending, for instance, is
    # capped at five per five minutes PER EMAIL in `OTP.is_send_rate_limited`
    # (lenny/core/auth.py), which is the dimension abuse actually has.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=borrow:5m rate=10r/m;
    # Raised from 10r/m burst 3. This zone guards a location that serves the
    # login PAGE as well as the OTP POST, so simply loading the form spent the
    # allowance meant for sending mail — four page views was the whole budget.
    limit_req_zone $binary_remote_addr zone=oauth:5m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=upload:5m rate=5r/m;
    # Opening one book fires 20-30 resource requests (manifest, xhtml pages,
    # css, images, positions.json) in a few seconds — the general 30r/m api
    # zone burst is exhausted almost immediately, 429ing random resources.
    limit_req_zone $binary_remote_addr zone=readium:10m rate=300r/m;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}

daemon off;
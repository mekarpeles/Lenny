user  nginx;
worker_processes 1;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;
events {
    worker_connections 1024;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 100M;

    # Recover the patron's address before anything is keyed on it.
    #
    # Without this, `$binary_remote_addr` is the PEER, and in any deployment
    # with a proxy in front of this container that peer is the same address for
    # every patron on the instance. Every zone below then degrades from a
    # per-client limit into ONE GLOBAL BUCKET: lennyforlibraries.org allowed
    # four OTP page loads across all patrons combined before returning 429, and
    # ten borrows a minute for the entire library. It looks fine for one user
    # and falls over the moment two people use the site at once, which is
    # exactly how it was found — during a demo.
    #
    # `real_ip_recursive` is deliberately left OFF (the default). nginx then
    # takes the LAST entry in X-Forwarded-For, which is the address the front
    # proxy actually observed. With it on, nginx would walk right-to-left
    # skipping trusted addresses — and a library whose own LAN sits inside the
    # trusted range would let a patron append a value and choose their own
    # apparent address.
    #
    # The range matches LENNY_FORWARDED_ALLOW_IPS' default (see
    # docker/api/Dockerfile and ArchiveLabs/lenny#210): Docker usually
    # allocates Compose networks from 172.16.0.0/12.
    #
    # Two limits an operator should know about, neither of them silent-safe:
    #
    # Any peer INSIDE this range is trusted and can therefore choose its own
    # apparent address. Docker's gateway is inside it, and compose.yaml
    # publishes this listener on 0.0.0.0, so a host-local or same-LAN caller
    # can forge. Narrow this to the front proxy's actual address, and publish
    # on 127.0.0.1 when a proxy fronts the container.
    #
    # Docker's default pools also include 192.168.0.0/16, and it spills there
    # once the 172.16 pool is exhausted. A node whose network landed in
    # 192.168.x gets no rewrite at all: the peer is outside this range, realip
    # does nothing, and the limits stay global with no error and no log line.
    # `docker network inspect lenny_lenny_network` shows the real subnet.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    # Only the OTP *send* is rate limited, not the page that renders the form.
    #
    # /v1/api/oauth/authorize serves the login form on GET and sends mail on
    # POST, and both came out of one small allowance — so four page views spent
    # the whole budget, which is the "error after 3-4 clicks" this fixes. An
    # empty key makes nginx skip limiting entirely, so GET is unlimited while
    # POST keeps exactly the budget it had.
    #
    # The send rate is deliberately NOT raised. `OTP.issue`
    # (lenny/routes/oauth.py) POSTs to Open Library and mails a
    # caller-supplied address with no application-level check in front of it:
    # `OTP.is_send_rate_limited` exists in lenny/core/auth.py but has no
    # callers, its only one having been dropped in f3be570. Until that guard is
    # restored this zone is the ONLY send-side control, and loosening it would
    # turn a per-site cap into per-IP outbound mail amplification.
    map $request_method $otp_send_key {
        POST    $binary_remote_addr;
        default "";
    }

    # Rate limiting: shared memory zones, no DB overhead.
    # These are crude flood stops, not per-account controls, and cannot be:
    # a public library's patrons all egress from one NAT address and share a
    # bucket however well it is keyed.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=borrow:5m rate=10r/m;
    # Same rate as before, keyed so that only POSTs count. The zone NAME is
    # unchanged on purpose: conf.d is bind-mounted while this file is baked
    # into the image, so a new conf.d against an old image must still find
    # every zone it references or nginx refuses to start.
    limit_req_zone $otp_send_key zone=oauth:5m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload:5m rate=5r/m;
    # Opening one book fires 20-30 resource requests (manifest, xhtml pages,
    # css, images, positions.json) in a few seconds — the general 30r/m api
    # zone burst is exhausted almost immediately, 429ing random resources.
    limit_req_zone $binary_remote_addr zone=readium:10m rate=300r/m;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}

daemon off;